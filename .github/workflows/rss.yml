name: Fetch QQQ Google News

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install feedparser requests

      - name: 运行监控脚本
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }} # 引入刚刚在 GitHub 设置的密钥
        run: python fetch_news.py
